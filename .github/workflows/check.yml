name: Check the registry

# On GitHub's runners: pull requests from forks run here, never on a self-hosted machine. No secrets, read-only.
on:
  pull_request:
  push:
    branches: [main]
  # Hosts change: the pinned versions are checked again every day
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check plugins.json and every pinned version
        run: node scripts/check.mjs
